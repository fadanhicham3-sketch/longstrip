name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Longstrip com.longstrip.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Make it full screen
        run: |
          F=android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>' $F

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Longstrip-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
