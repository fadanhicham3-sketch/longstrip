  var MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', avif: 'image/avif', bmp: 'image/bmp' };
  var collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
  var byName = function (a, b) { return collator.compare(a.name, b.name); };
  var SPEEDS = [30, 60, 100, 160, 240];

  /* ---------- settings (per viewer, optional) ---------- */
  var SKEY = 'longstrip.settings.v1';
  var settings = { width: 'fit', gap: 0, speed: 2, sort: 'name', dir: 'asc', autoNext: true, chDir: 'asc', bright: 100, warm: 0, mode: 'strip', lay: 'grid' };
  try { Object.assign(settings, JSON.parse(localStorage.getItem(SKEY) || '{}')); } catch (e) {}
  function saveSettings() { try { localStorage.setItem(SKEY, JSON.stringify(settings)); } catch (e) {} }
  try { if (!localStorage.getItem('longstrip.nextfix')) { settings.autoNext = true; localStorage.setItem('longstrip.nextfix', '1'); saveSettings(); } } catch (e) {}

  var tt;
  function toast(msg, ms) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('on'); }, ms || 3200);
  }
  function clearToast() { clearTimeout(tt); $('#toast').classList.remove('on'); }

  /* ---------- storage: IndexedDB with in-memory fallback ---------- */
  var db = null, mem = { meta: new Map(), pages: new Map() };
  function openDB() {
    return new Promise(function (res, rej) {
