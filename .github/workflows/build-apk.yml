  $('#edit-save').addEventListener('click', async function () {
    var m = metas.find(function (x) { return x.id === editId; }); if (!m) return;
    m.title = $('#edit-title').value.trim() || m.title; m.series = $('#edit-series').value.trim();
    await kv.put('meta', m); closeEdit(); render();
  });
  $('#edit-reset').addEventListener('click', async function () {
    var m = metas.find(function (x) { return x.id === editId; }); if (!m) return;
    m.page = 0; m.frac = 0; m.pct = 0; await kv.put('meta', m); closeEdit(); render(); toast('Marked unread.');
  });
  $('#edit-del').addEventListener('click', async function () {
    var b = $('#edit-del');
    if (b.textContent === 'Delete') { b.textContent = 'Tap again to delete'; delTimer = setTimeout(resetDel, 3500); return; }
    var id = editId; closeEdit();
    try { await kv.del('pages', id); await kv.del('meta', id); toast('Episode deleted.'); } catch (e) { toast('Could not delete that episode.'); }
    refresh();
  });

  $('#ser-close').addEventListener('click', closeSeriesSheet);
  $('#sheet-series').addEventListener('click', function (e) { if (e.target === e.currentTarget) closeSeriesSheet(); });
  $('#ser-save').addEventListener('click', async function () {
    var s = lib.seriesMap.get(serKey), name = $('#ser-name').value.trim(); if (!s || !name) return;
    for (var i = 0; i < s.chapters.length; i++) { s.chapters[i].series = name; await kv.put('meta', s.chapters[i]); }
    if (viewKey === serKey) viewKey = name.toLowerCase();
    closeSeriesSheet(); render();
  });
  $('#ser-reset').addEventListener('click', async function () {
    var s = lib.seriesMap.get(serKey); if (!s) return;
    for (var i = 0; i < s.chapters.length; i++) { var m = s.chapters[i]; m.page = 0; m.frac = 0; m.pct = 0; await kv.put('meta', m); }
    closeSeriesSheet(); render(); toast('Marked all unread.');
  });
  $('#ser-del').addEventListener('click', async function () {
    var b = $('#ser-del');
    if (b.textContent === 'Delete series') { b.textContent = 'Tap again to delete'; serDelTimer = setTimeout(resetSerDel, 3500); return; }
    var s = lib.seriesMap.get(serKey); closeSeriesSheet(); if (!s) return;
    try {
      for (var i = 0; i < s.chapters.length; i++) { await kv.del('pages', s.chapters[i].id); await kv.del('meta', s.chapters[i].id); }
      toast('Series deleted.');
    } catch (e) { toast('Could not delete the whole series.'); }
    viewKey = null; refresh();
  });
  $('#sv-back').addEventListener('click', function () { viewKey = null; render(); window.scrollTo(0, 0); });
  $('#sv-order').addEventListener('click', function () { settings.chDir = settings.chDir === 'desc' ? 'asc' : 'desc'; saveSettings(); render(); });
  $('#sv-manage').addEventListener('click', function () { if (viewKey) openSeriesSheet(viewKey); });

  $('#r-back').addEventListener('click', closeReader);
  var sc = $('#scroller');
  sc.addEventListener('scroll', onScroll, { passive: true });
  var lastTap = { t: 0, x: 0, y: 0 };
  sc.addEventListener('click', function stripTap(e) {
    if (!e.defer && !e.target.closest('button')) { tapGate(e, stripTap, zoomStrip, 0); return; }
    if (e.target.closest('button')) return;
    try { localStorage.setItem('longstrip.hint', '1'); } catch (er) {}
    var fx = e.clientX / innerWidth, fy = e.clientY / innerHeight;
    var hid = $('#reader').classList.contains('ui-hidden'), y0 = sc.scrollTop; if (fx > 0.3 && fx < 0.7) { var ct = setTimeout(function () { setUI(hid); }, 240); tg.u = function () { clearTimeout(ct); }; return; }
    if (cur && cur.auto) setAuto(false);
    if (!$('#reader').classList.contains('ui-hidden')) setUI(false);
    sc.scrollBy({ top: (fy < 0.5 ? -1 : 1) * sc.clientHeight * 0.75, behavior: 'smooth' }); tg.u = function () { sc.scrollTo({ top: y0, behavior: 'auto' }); };
  });
  document.querySelectorAll('.bar').forEach(function (b) { b.addEventListener('pointerdown', function (e) { if (e.target.closest('button, input')) uiTouch = Date.now(); }); });
  ['touchmove', 'wheel'].forEach(function (n) { sc.addEventListener(n, function () { if (cur && cur.auto) setAuto(false); }, { passive: true }); });
  var sl = $('#r-slider');
  sl.addEventListener('input', function () { if (!cur) return; cur.sliding = true; var i = +sl.value - 1; sc.scrollTop = cur.els[i].offsetTop; $('#r-count').textContent = (i + 1) + ' / ' + cur.els.length; });
  sl.addEventListener('change', function () { if (cur) { cur.sliding = false; cur.lastY = sc.scrollTop; } });
  document.querySelectorAll('[data-w]').forEach(function (b) { b.addEventListener('click', function () { anchored(function () { settings.width = b.dataset.w; applySettings(); }); saveSettings(); }); });
  document.querySelectorAll('[data-g]').forEach(function (b) { b.addEventListener('click', function () { anchored(function () { settings.gap = +b.dataset.g; applySettings(); }); saveSettings(); }); });
  $('#b-play').addEventListener('click', function () { if (cur) setAuto(!cur.auto); });
  $('#b-speed').addEventListener('input', function (e) { settings.speed = +e.target.value; saveSettings(); });
  $('#r-gear').addEventListener('click', function () { clearToast(); $('#sheet-view').hidden = false; });
  $('#view-done').addEventListener('click', function () { $('#sheet-view').hidden = true; });
  $('#sheet-view').addEventListener('click', function (e) { if (e.target === e.currentTarget) e.currentTarget.hidden = true; });
  $('#s-dim').addEventListener('input', function (e) { settings.bright = +e.target.value; applyTint(); saveSettings(); });
  $('#s-warm').addEventListener('input', function (e) { settings.warm = +e.target.value; applyTint(); saveSettings(); });
  $('#s-next').addEventListener('change', function (e) { settings.autoNext = e.target.checked; saveSettings(); });

  $('#sort').addEventListener('change', function (e) {
    settings.sort = e.target.value; settings.dir = settings.sort === 'name' ? 'asc' : 'desc';
    saveSettings(); updateSortUI(); render();
  });
  $('#sort-dir').addEventListener('click', function () {
    settings.dir = settings.dir === 'asc' ? 'desc' : 'asc';
    saveSettings(); updateSortUI(); render();
  });
  $('#r-prev').addEventListener('click', goPrev);
  $('#r-next').addEventListener('click', function () { goNext(false); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!$('#sheet-view').hidden) $('#sheet-view').hidden = true;
      else if (!$('#sheet-add').hidden) closeAdd(); else if (!$('#sheet-edit').hidden) closeEdit(); else if (!$('#sheet-series').hidden) closeSeriesSheet(); else if (cur) closeReader(); return;
    }
    if (!cur || e.target.tagName === 'INPUT') return;
    if (galKey(e)) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      var shown = locate(sc.scrollTop + 4).i + (e.key === 'ArrowRight' ? 1 : -1);
      shown = Math.max(0, Math.min(cur.els.length - 1, shown)); sc.scrollTop = cur.els[shown].offsetTop; e.preventDefault();
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && cur) saveProgress();
    if (!document.hidden && cur) lockScreen();
  });

  (async function init() {
    try { db = await openDB(); } catch (e) { db = null; $('#mem-note').hidden = false; }
    updateSortUI();
    await seedIfFirst();
    await refresh();
  })();
})();
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});</script></body></html>
